<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <title>Claude Academy – Claude lernen von 0 auf sicher</title>
    <meta
      name="description"
      content="Lerne Claude Schritt für Schritt: verständlich erklärt, mit echten Beispielen, kopierbaren Prompts, Übungen und Quiz. Für komplette Anfänger."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Claude Academy – Claude lernen von 0 auf sicher" />
    <meta
      property="og:description"
      content="Die interaktive Lernplattform für Claude: Grundlagen, Prompting, Dateien, Projekte, Claude Code und Profi-Themen."
    />
    <meta property="og:locale" content="de_DE" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Theme vor dem ersten Paint setzen -> kein Flackern beim Laden.
      // Reihenfolge: eigene Auswahl > Vorgabe der Umgebung > Systemeinstellung.
      // Die Umgebungsvorgabe zählt, weil die Seite auch eingebettet laufen kann
      // (z. B. als Artefakt), wo das Design dort schon gewählt wurde.
      (function () {
        var root = document.documentElement
        // Auch beim eingebetteten Betrieb soll die Sprache stimmen.
        root.lang = 'de'
        var host = root.dataset.theme
        var stored = null
        try {
          stored = localStorage.getItem('ca:theme')
        } catch (e) {
          stored = null
        }
        if (stored === 'light' || stored === 'dark') {
          root.dataset.theme = stored
          return
        }
        if (host === 'light' || host === 'dark') return
        var dark = false
        try {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        } catch (e) {
          dark = false
        }
        root.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
