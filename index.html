<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="%BRAND_NAME% – %BRAND_TAGLINE% Lerne Schritt für Schritt das Zehn-Finger-Schreiben auf deutschen QWERTZ-Tastaturen."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>%BRAND_NAME% – %BRAND_TAGLINE%</title>
    <script>
      // Setzt das Farbschema vor dem ersten Rendern, damit nichts aufflackert.
      (function () {
        var root = document.documentElement;
        var theme = 'system';
        var motion = true;
        try {
          var raw = window.localStorage.getItem('%SETTINGS_KEY%');
          if (raw) {
            var settings = JSON.parse(raw);
            if (settings && ['light', 'dark', 'system'].indexOf(settings.theme) !== -1) {
              theme = settings.theme;
            }
            if (settings && settings.animationsEnabled === false) motion = false;
          }
        } catch (error) {
          // Kein Zugriff auf LocalStorage – Systemeinstellung verwenden.
        }
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = theme === 'dark' || (theme === 'system' && prefersDark);
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.style.colorScheme = dark ? 'dark' : 'light';
        if (!motion) root.setAttribute('data-motion', 'reduced');
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem">
        %BRAND_NAME% benötigt JavaScript. Bitte aktiviere JavaScript in deinem Browser.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
