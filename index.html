<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="%BRAND_NAME% – %BRAND_TAGLINE% Lerne Schritt für Schritt das Zehn-Finger-Schreiben auf deutschen QWERTZ-Tastaturen."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>%BRAND_NAME% – %BRAND_TAGLINE%</title>
    <script>
      // Setzt ein explizit gewähltes Farbschema vor dem ersten Rendern, damit nichts aufflackert.
      // Bei „System“ bleibt data-theme unberührt: Dann entscheidet prefers-color-scheme im CSS.
      (function () {
        var root = document.documentElement;
        try {
          var raw = window.localStorage.getItem('%SETTINGS_KEY%');
          var settings = raw ? JSON.parse(raw) : null;
          if (settings && (settings.theme === 'light' || settings.theme === 'dark')) {
            root.setAttribute('data-theme', settings.theme);
          }
          if (settings && settings.animationsEnabled === false) {
            root.setAttribute('data-motion', 'reduced');
          }
        } catch (error) {
          // Kein Zugriff auf LocalStorage – Systemeinstellung verwenden.
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem">
        %BRAND_NAME% benötigt JavaScript. Bitte aktiviere JavaScript in deinem Browser.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
