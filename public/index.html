<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Smart Homework Manager – digitales Hausaufgabenheft mit KI-Lernassistent." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>Smart Homework Manager</title>

    <!-- Als App auf den Home-Bildschirm: Symbol, Startverhalten, Statusleiste. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/app-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hausaufgaben" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/components.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Zum Inhalt springen</a>

    <div class="app-shell">
      <header class="app-header" id="app-header"></header>
      <nav class="app-nav" id="app-nav" aria-label="Hauptnavigation"></nav>
      <main class="app-main" id="main" tabindex="-1"></main>
    </div>

    <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>
    <div id="dialog-root"></div>

    <noscript>
      <p style="padding: 2rem; text-align: center">
        Diese Anwendung benötigt JavaScript. Bitte aktiviere JavaScript in deinem Browser.
      </p>
    </noscript>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
